[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-evolution-engine"
version = "0.1.0"
description = "Agent Tool Calling Adaptive Optimization Engine"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "fastapi>=0.100,<1.0",
    "uvicorn[standard]>=0.23,<1.0",
    "aiosqlite>=0.19,<1.0",
    "joblib>=1.3,<2.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.3,<2.0",
    "scipy>=1.11,<2.0",
    "networkx>=3.1,<4.0",
    "mcp>=1.0,<2.0",
    "httpx>=0.25,<0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::PendingDeprecationWarning:starlette.*",
    "ignore:The hashes produced for directed graphs:UserWarning:networkx.*",
]

[tool.setuptools.packages.find]
where = ["src"]
